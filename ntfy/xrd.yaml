apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xntfys.nidavellir.siliconsaga.org
spec:
  group: nidavellir.siliconsaga.org
  names:
    kind: XNtfy
    plural: xntfys
  claimNames:
    kind: Ntfy
    plural: ntfys
  defaultCompositionRef:
    name: xntfy-default
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    replicasOverride:
                      type: integer
                      minimum: 0
                      description: "Optional override for replica count. When unset, the composition runs 1 replica in every realm. Set 0 to pin a realm off on purpose — but note Alertmanager posts to this Service in every realm, so 0 means its alerts fail to deliver."
                    tailnet:
                      type: string
                      description: "The tailnet's MagicDNS suffix (e.g. tailf5b47a.ts.net). With cluster-identity tailnetNode set, the Service is exposed as ntfy-<tailnetNode> and base-url is http://ntfy-<tailnetNode>.<tailnet>. Without tailnetNode the Service is not exposed and base-url is unset."
      additionalPrinterColumns:
      - name: READY
        type: string
        jsonPath: .status.conditions[?(@.type=='Ready')].status
      - name: SYNCED
        type: string
        jsonPath: .status.conditions[?(@.type=='Synced')].status
