# ApplicationSet for the Tailscale Kubernetes operator.
#
# Joins the cluster to the tailnet so Services annotated `tailscale.com/expose`
# (e.g. ntfy on GKE) get a tailnet device + MagicDNS name — no public ingress.
# Requires the `operator-oauth` Secret (clientId/clientSecret) pre-created in the
# `tailscale` namespace out-of-band; see ntfy/README.md.
#
# The chart's default volume wiring already references a Secret named
# `operator-oauth` (with keys `client_id` and `client_secret`) when
# oauthSecretVolume is unset — no additional Helm values needed.
#
# operatorConfig.hostname sets the tailnet device name for this cluster's
# operator. It MUST be unique per cluster: the chart default `tailscale-operator`
# would collide when two clusters share one tailnet. It is built from the
# identity's tailnet-node annotation on the `in-cluster` Secret:
# `tailscale-operator-<tailnet-node>`.
#
# Sync-wave 4: before ntfy (wave 6) so the operator is ready to expose its Service.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tailscale-operator
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: create-update
  generators:
    # Only clusters whose identity names a tailnet node run the operator
    # (2026-11-13 review): prod clusters by name, test clusters by stamp, labs
    # not at all unless a test asks for it.
    - clusters:
        selector:
          matchLabels:
            nordri.siliconsaga.org/tailnet: "true"
  template:
    metadata:
      name: tailscale-operator
      namespace: argo
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: default
      source:
        repoURL: https://pkgs.tailscale.com/helmcharts
        chart: tailscale-operator
        targetRevision: "1.98.3"
        helm:
          values: |-
            {{- if not (index .metadata.annotations "nordri.siliconsaga.org/tailnet-node") }}{{ fail "identity: tailnet-node annotation missing on the in-cluster Secret" }}{{ end }}
            operatorConfig:
              hostname: tailscale-operator-{{ index .metadata.annotations "nordri.siliconsaga.org/tailnet-node" }}
      destination:
        server: https://kubernetes.default.svc
        namespace: tailscale
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
