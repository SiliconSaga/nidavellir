# ArgoCD Application for the Keycloak instance.
#
# Syncs keycloak/ — the Mimir Postgres claim, the Keycloak CR, and the
# HTTPRoute. This is the GENERIC platform Keycloak only; realm/app-specific
# realm imports are realm-injected (nidavellir#20), not shipped here.
# Sync-wave 12: after the
# operator app (wave 8) so the CRDs + controller exist first;
# SkipDryRunOnMissingResource covers the first-sync race where the CRDs
# are still establishing.
#
# Expected bring-up order: Postgres claim goes Ready first; the Keycloak
# pod crash-loops until its DB is reachable — that's provisioning, not
# failure.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'http://gitea-http.gitea.svc.cluster.local:3000/nordri-admin/nidavellir.git'
    targetRevision: HEAD
    path: keycloak
    directory:
      recurse: false   # explicit (matches the operator app); keycloak/ is flat
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    # SUSPENDED 2026-09-06, with the operator app. The Keycloak StatefulSet is
    # scaled to 0; with the operator also down, nothing reconciles it back.
    #
    # The Postgres claim and the HTTPRoute in keycloak/ are deliberately left
    # in place: the realm data stays on its PVC and keycloak.cmdbee.org keeps
    # resolving, so resuming is a scale-up rather than a re-provision. That
    # also keeps the claim — one of only two users of the legacy Mimir
    # PostgreSQLInstance path — available for the eventual DataService move.
    #
    # To resume: restore the automated block here and on the operator app,
    # scale the operator to 1, and let it reconcile the Keycloak CR.
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
