# ArgoCD Application for the Keycloak instance.
#
# Syncs keycloak/ — the Mimir Postgres claim, the Keycloak CR, and the
# HTTPRoute. This is the GENERIC platform Keycloak only; realm/app-specific
# realm imports are realm-injected (nidavellir#20), not shipped here.
# Sync-wave 12: after the
# operator app (wave 8) so the CRDs + controller exist first;
# SkipDryRunOnMissingResource covers the first-sync race where the CRDs
# are still establishing.
#
# Expected bring-up order: Postgres claim goes Ready first; the Keycloak
# pod crash-loops until its DB is reachable — that's provisioning, not
# failure.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'http://gitea-http.gitea.svc.cluster.local:3000/nordri-admin/nidavellir.git'
    targetRevision: HEAD
    path: keycloak
    directory:
      recurse: false   # explicit (matches the operator app); keycloak/ is flat
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    # RESUMED 2026-09-15, with the operator app. Suspended 2026-09-06 while
    # Keycloak had no consumer; the leidangr realm import now needs it, and
    # the suspension itself proved costly: a 2026-09-12 hydration from a
    # checkout that predated it re-enabled automation from stale content and
    # re-provisioned the legacy Percona cluster this app had already moved
    # off. A parked app is only parked until the next rehydrate.
    #
    # prune is load-bearing here: it is what removes the legacy
    # PostgreSQLInstance claim when a cluster still carries one.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
