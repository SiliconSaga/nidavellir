# ArgoCD Application for ntfy (notification delivery, Nidavellir platform layer).
#
# Deploys the XNtfy XRD + Composition + Ntfy claim from the nidavellir repo's
# ntfy/ directory. ntfy is active (replicas 1) in EVERY realm as of 2026-11-03.
#
# It used to be a cold standby (replicas 0) off GKE, on the reasoning that
# homelab had no external exposure so a running ntfy had no audience. The first
# consumer is not a phone, though — heimdall's Alertmanager posts to
# ntfy.ntfy.svc.cluster.local in every realm, so 0 replicas meant a Service with
# no endpoints and every homelab alert failing to deliver. Reaching the phone
# still needs the tailnet, but reaching ntfy is what keeps an alert from
# vanishing. Set parameters.replicasOverride to pin a realm back to 0.
#
# Sync-wave 6: after the Tailscale operator (wave 4) so the gke Service can be
# exposed to the tailnet on first sync.
#
# Source: during bootstrap ArgoCD pulls from internal Gitea. After the cluster
# is stable, repoURL moves to FORGEJO — not GitHub. See "Repository cutover"
# in vegvisir/README.md and docs/plans/2026-08-18-forgejo-cutover-design.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'http://gitea-http.gitea.svc.cluster.local:3000/nordri-admin/nidavellir.git'
    targetRevision: HEAD
    path: ntfy
  destination:
    server: https://kubernetes.default.svc
    namespace: ntfy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
