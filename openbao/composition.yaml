apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xopenbao-standalone
  labels:
    provider: openbao
spec:
  mode: Pipeline
  compositeTypeRef:
    apiVersion: nidavellir.siliconsaga.org/v1alpha1
    kind: XOpenBao
  pipeline:

  # ──────────────────────────────────────────────────────────
  # Step 0: Load cluster identity (EnvironmentConfig → context).
  # Provides storageClass + domain per environment (homelab/gke).
  # ──────────────────────────────────────────────────────────
  - step: load-cluster-identity
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Reference
          ref:
            name: cluster-identity

  # ──────────────────────────────────────────────────────────
  # Step 1: OpenBao Helm Release (single-node Raft, auto-unseal
  # per environment — realm ADR 0004; seal: shamir opts out;
  # runbooks in docs/secrets-management.md).
  # fullnameOverride pins the workload/Service names to plain
  # `openbao` (pod openbao-0, svc openbao) — without it the helm
  # release name inherits the XR's random claim suffix and every
  # stable reference (ClusterSecretStore URL, HTTPRoute backend,
  # kuttl asserts) would chase a moving name. Deliberate
  # consequence: this composition is SINGLETON-per-cluster (one
  # claim, fixed `openbao` namespace + names); a second claim
  # would collide by design. Contract documented on the XRD.
  # ──────────────────────────────────────────────────────────
  - step: deploy-openbao
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $identity := index .context "apiextensions.crossplane.io/environment" -}}
          {{- $storageClass := $identity.storageClass -}}
          {{- $version := .observed.composite.resource.spec.parameters.chartVersion | default "0.28.3" -}}
          {{- $size := .observed.composite.resource.spec.parameters.storageSize | default "2Gi" -}}
          {{- /* Default matches the XRD: shamir, so a claim that says nothing keeps today's manual posture. */ -}}
          {{- $seal := .observed.composite.resource.spec.parameters.seal | default "shamir" -}}
          {{- $env := $identity.environment -}}
          {{- if and (eq $seal "auto") (ne $env "gke") (ne $env "homelab") -}}
          {{ fail (printf "seal: auto has no seal configuration for environment %q (expected gke or homelab); set parameters.seal: shamir to opt out" $env) }}
          {{- end -}}
          {{- /* Needed on gke whatever the seal: the snapshot agent's bucket name derives from it, and so does the gcpckms seal. */ -}}
          {{- if and (eq $env "gke") (or (not $identity.gcpProject) (hasPrefix "__" $identity.gcpProject)) -}}
          {{ fail "cluster-identity gcpProject is required on gke for the snapshot bucket (<project>-openbao-backups) and the gcpckms seal (stamped by nordri hydration from GCP_PROJECT; the raw placeholder counts as missing)" }}
          {{- end -}}
          {{- if and (eq $seal "auto") (eq $env "gke") (not $identity.gcpRegion) -}}
          {{ fail "cluster-identity gcpRegion is required for the gcpckms seal on gke (the region of the openbao key ring)" }}
          {{- end -}}
          apiVersion: helm.crossplane.io/v1beta1
          kind: Release
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}-openbao
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: openbao-release
          spec:
            forProvider:
              chart:
                name: openbao
                repository: https://openbao.github.io/openbao-helm
                version: "{{ $version }}"
              namespace: openbao
              values:
                fullnameOverride: openbao
                injector:
                  enabled: false
                # Daily Raft snapshot to a dedicated bucket per environment
                # (realm go-live design, 2026-09-16). This is the chart's own
                # agent: CronJob `openbao-snapshot` logs in through Kubernetes
                # auth as ServiceAccount `openbao-snapshot` with role
                # `openbao-backup` (nordri lib/openbao.sh grants it read on
                # sys/storage/raft/snapshot and nothing else), runs `bao
                # operator raft snapshot save`, uploads with s3cmd and expires
                # objects older than s3ExpireDays. Independent of $seal — a
                # Shamir instance can snapshot too. 05:00 UTC, an hour before
                # Velero's disk snapshot, which stays the crash-consistent net.
                #
                # s3cmd's --host-bucket is a DNS-style TEMPLATE; a plain host
                # equal to --host makes it path-style, which the GCS S3-interop
                # endpoint and Garage both want. The credential Secret is parked
                # by nordri (gke-provision.sh openbao-backup-setup; bootstrap
                # Layer 5 on homelab) with the chart's key names,
                # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. Agent contract
                # read from ghcr.io/openbao/openbao-snapshot-agent:0.3.0's
                # /bao-snapshot.sh and a `helm template` of chart 0.28.3.
                snapshotAgent:
                  enabled: true
                  schedule: "0 5 * * *"
                  s3CredentialsSecret: openbao-backup-s3
                  config:
                    baoAuthPath: kubernetes
                    baoRole: openbao-backup
                    {{- if eq $env "gke" }}
                    # No S3_EXPIRE_DAYS on gke: the bucket's 30-day lifecycle
                    # rule (gke-provision.sh openbao-backup-setup) does the
                    # expiry, so the agent's identity needs create and read
                    # only — it cannot delete or overwrite history.
                    s3ExpireDays: ""
                    s3Host: storage.googleapis.com
                    s3Bucket: storage.googleapis.com
                    s3Uri: s3://{{ $identity.gcpProject }}-openbao-backups/openbao/
                    # GCS interop accepts HMAC keys with either signature
                    # version; v2 is the one it has served longest and needs
                    # no region lookup. Drop the flag if a run reports it refused.
                    s3cmdExtraFlag: "--signature-v2"
                    {{- else }}
                    # Garage has no lifecycle rule provisioned, so the agent
                    # expires objects itself; its key has read/write on the
                    # bucket for that reason.
                    s3ExpireDays: "30"
                    s3Host: garage.garage.svc.cluster.local:3900
                    s3Bucket: garage.garage.svc.cluster.local:3900
                    s3Uri: s3://openbao-backups/openbao/
                    # Plain HTTP in-cluster, and Garage checks the SigV4 region
                    # against its configured s3_region ("garage" — the same
                    # value velero-homelab passes).
                    s3cmdExtraFlag: "--no-ssl --region=garage"
                    {{- end }}
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
                server:
                  {{- if and (eq $seal "auto") (eq $env "gke") }}
                  # Workload Identity: the KSA the chart creates (plain `openbao`
                  # via fullnameOverride) impersonates the GSA that holds
                  # encrypt/decrypt on the KMS key. Provisioned by
                  # nordri/gke-provision.sh openbao-seal-setup.
                  serviceAccount:
                    annotations:
                      iam.gke.io/gcp-service-account: openbao-seal@{{ $identity.gcpProject }}.iam.gserviceaccount.com
                  {{- end }}
                  {{- if and (eq $seal "auto") (eq $env "homelab") }}
                  # Static seal key from the Secret nordri bootstrap Layer 2.9
                  # creates. The seal stanza reads it via env://.
                  extraSecretEnvironmentVars:
                    - envName: BAO_SEAL_STATIC_KEY
                      secretName: openbao-seal-key
                      secretKey: key
                  {{- end }}
                  standalone:
                    enabled: true
                    config: |
                      ui = true
                      listener "tcp" {
                        address         = "[::]:8200"
                        cluster_address = "[::]:8201"
                        tls_disable     = 1
                      }
                      storage "raft" {
                        path = "/openbao/data"
                      }
                      {{- if and (eq $seal "auto") (eq $env "gke") }}
                      seal "gcpckms" {
                        project    = "{{ $identity.gcpProject }}"
                        region     = "{{ $identity.gcpRegion }}"
                        key_ring   = "openbao"
                        crypto_key = "unseal"
                      }
                      {{- end }}
                      {{- if and (eq $seal "auto") (eq $env "homelab") }}
                      seal "static" {
                        current_key_id = "homelab-1"
                        current_key    = "env://BAO_SEAL_STATIC_KEY"
                      }
                      {{- end }}
                  dataStorage:
                    enabled: true
                    size: {{ $size }}
                    storageClass: {{ $storageClass }}
                  ha:
                    enabled: false
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi

  # ──────────────────────────────────────────────────────────
  # Step 2: HTTPRoute via provider-kubernetes Object. TLS comes
  # free from the wildcard cert on the Gateway's websecure
  # listener (vegvisir); host resolves per-env via $domain.
  # ──────────────────────────────────────────────────────────
  - step: deploy-ingress
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $identity := index .context "apiextensions.crossplane.io/environment" -}}
          {{- $domain := .observed.composite.resource.spec.parameters.domain | default $identity.domain -}}
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ .observed.composite.resource.metadata.name }}-openbao-route
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: openbao-route
          spec:
            forProvider:
              manifest:
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  name: openbao
                  namespace: openbao
                spec:
                  parentRefs:
                    - name: traefik-gateway
                      namespace: kube-system
                      kind: Gateway
                      sectionName: websecure
                  hostnames:
                    - "openbao.{{ $domain }}"
                  rules:
                    - matches:
                        - path:
                            type: PathPrefix
                            value: /
                      backendRefs:
                        - name: openbao
                          port: 8200

  # ──────────────────────────────────────────────────────────
  # Step 3: Auto-ready
  # ──────────────────────────────────────────────────────────
  - step: auto-ready
    functionRef:
      name: function-auto-ready
