apiVersion: nidavellir.siliconsaga.org/v1alpha1
kind: OpenBaoInstance
metadata:
  name: openbao
  namespace: openbao
spec:
  parameters:
    storageSize: "2Gi"
    # The graduation (realm ADR 0004, go-live 2026-09-16): gke seals through
    # Cloud KMS via Workload Identity (nordri gke-provision.sh
    # openbao-seal-setup must have run), homelab through the static key in
    # Secret openbao-seal-key (bootstrap Layer 2.9). An instance initialized
    # under this seal holds recovery keys, not unseal keys; one initialized
    # under shamir needs the one-time migration in docs/secrets-management.md
    # before its pod is restarted.
    seal: auto
