# Offline-render stand-in for a durable homelab cluster whose identity says
# role: test (a scratch cluster: no puller, no branch protection).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: cluster-identity
data:
  domain: homelab.local
  environment: homelab
  storageClass: local-path
  harborRole: local
  harborCentral: harbor.cmdbee.org
  maturity: durable
  role: test
