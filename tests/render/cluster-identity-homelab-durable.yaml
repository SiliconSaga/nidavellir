# Offline-render stand-in for a homelab cluster-identity graduated to durable
# (the committed manifest stays bootstrap; a graduation is an identity edit).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: cluster-identity
data:
  domain: homelab.local
  environment: homelab
  storageClass: local-path
  harborRole: local
  harborCentral: harbor.cmdbee.org
  maturity: durable
