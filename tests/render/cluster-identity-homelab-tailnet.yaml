# Offline-render stand-in for a homelab cluster-identity that carries a tailnet
# node (the homelab identity plus tailnetNode), so ntfy exposes on the tailnet.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: cluster-identity
data:
  domain: homelab.local
  environment: homelab
  storageClass: local-path
  harborRole: local
  harborCentral: harbor.cmdbee.org
  maturity: bootstrap
  tailnetNode: homelab-test-20261113-1430
