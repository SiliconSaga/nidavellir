# Operator-managed Keycloak 26.6.3 instance, v2beta1 schema (v2alpha1 is
# deprecated). Live field names: kubectl explain keycloak.spec --api-version
# k8s.keycloak.org/v2beta1
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    # Full JDBC URL so sslmode is explicit: Mimir's pgBouncer requires TLS and
    # JDBC, unlike libpq, does not negotiate it by default.
    url: jdbc:postgresql://mimir-postgres-pgbouncer.mimir.svc:5432/keycloak?sslmode=require
    # The Mimir DataService secret publishes `username` + `password`.
    usernameSecret:
      name: keycloak-db-dataservice
      key: username
    passwordSecret:
      name: keycloak-db-dataservice
      key: password
  # Dynamic issuer — follows the request host, so one instance serves
  # keycloak.cmdbee.org on GKE and keycloak.localhost on homelab. Pinning it
  # per-env is a hardening item alongside TLS.
  hostname:
    strict: false
  # TLS terminates at the shared traefik-gateway, so serve plain HTTP
  # in-cluster and trust its X-Forwarded-* headers.
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  # Cold starts are slow (JVM warm-up, a Quarkus re-augmentation, a JGroups
  # discovery timeout) and /health/live allows only 1s per check — a timeout
  # the CRD does not expose, so tolerance has to come from the count. 18
  # failures at the default 10s period is three minutes: long enough that a
  # warm-up stall is survivable, short enough to still catch a hung server.
  livenessProbe:
    failureThreshold: 18
  # Sized from measurement: 6m CPU p95, 608Mi memory p95. Idles near zero but
  # bursts to ~723m while the JVM warms, so the request is a floor and the
  # limit carries the spike. The limit stays above that burst — throttling
  # warm-up is what made the liveness probe fire in the first place.
  resources:
    requests:
      cpu: 25m
      memory: 600Mi
    limits:
      cpu: 1000m
      memory: 1Gi
