# The Keycloak instance CR (operator-managed, Keycloak 26.6.3 — field
# names verified against the v2beta1 schema in the vendor mirror,
# components/keycloak-k8s-resources/kubernetes/ at tag 26.6.3;
# v2alpha1 is deprecated there).
#
# DB credentials come from the Mimir DataService secret (see
# dataservice.yaml), which publishes `username` + `password` — NOT the
# `user` + `password` of the Percona claim secret this replaced.
# TLS terminates at the shared traefik-gateway; Keycloak serves plain
# HTTP in-cluster (httpEnabled) and trusts X-Forwarded-* headers from
# the gateway (proxy.headers). Hostname is dynamic (see below): the
# external URL is https://keycloak.cmdbee.org on GKE (wildcard TLS) and
# http://keycloak.localhost on homelab (web listener — route rendered
# by the sso-demo composition).
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    # Full JDBC URL rather than host/port/database, so sslmode is stated
    # explicitly. Mimir's pgBouncer runs client_tls_sslmode = require, and
    # JDBC does NOT default to TLS the way libpq's sslmode=prefer does —
    # that exact gap took Artifactory down with "FATAL: SSL required
    # (SQLSTATE 08P01)" after a migration whose psql-based check had passed.
    url: jdbc:postgresql://mimir-postgres-pgbouncer.mimir.svc:5432/keycloak?sslmode=require
    usernameSecret:
      name: keycloak-db-dataservice
      key: username
    passwordSecret:
      name: keycloak-db-dataservice
      key: password
  # Hostname-v2 dynamic mode: the issuer follows the request host —
  # https://keycloak.cmdbee.org via the GKE gateway, http://keycloak.localhost
  # via the homelab web listener (the SSO demo's browser path). A pinned
  # hostname would make the issuer unreachable from a homelab browser.
  # Re-pinning per-env is a hardening-phase item alongside TLS.
  hostname:
    strict: false
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  # Sized from measurement: 6m CPU p95, 608Mi memory p95.
  #
  # The CPU request is a floor rather than the p95, because this is the one
  # workload where p95 is misleading — it idles near zero but bursts to ~723m
  # while the JVM warms. Reserving for the burst would hold most of a core
  # unused almost always; the limit covers the burst instead.
  #
  # The ceiling used to be 500m — deliberately below that burst, accepting a
  # throttled cold start, on the condition "revisit if startup ever meets a
  # probe deadline." It did, and the bill came due on homelab: keycloak-0
  # reached 5250 restarts in 35 days while every other pod on the node sat
  # between 15 and 30.
  #
  # The mechanism is a loop that feeds itself. The operator's default liveness
  # probe allows one second per check and three consecutive failures, and it
  # takes over the moment the startup probe hands off — while the JVM is still
  # JIT-warming and throttled to two thirds of the CPU it is asking for. A
  # /health/live that misses three one-second deadlines gets the container
  # killed, which forces another cold start, which is throttled again. Once
  # the loop starts it sustains itself: 78 of those restarts landed in the
  # eight hours before it happened to settle.
  #
  # A limit is a ceiling, not a reservation, so 1 core costs nothing while
  # this idles near zero — and the node runs at 8% of 28 cores, so there is
  # no contention to protect against. Raising the ceiling above the burst is
  # cheaper than reaching for spec.unsupported.podTemplate to loosen probes
  # the operator owns.
  resources:
    requests:
      cpu: 25m
      memory: 600Mi
    limits:
      cpu: 1000m
      memory: 1Gi
